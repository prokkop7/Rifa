<text x="600" y="685" text-anchor="middle" font-family="Arial,sans-serif" letter-spacing="3" font-size="17" fill="#99bcc6">ILUSTRAÇÕES CONCEITUAIS • NÃO SÃO FOTOGRAFIAS DOS APARELHOS</text>
