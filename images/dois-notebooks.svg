<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc">
<title id="title">Demonstração AÇÕES: dois notebooks, um Dell e um HP</title><desc id="desc">Arte ilustrativa dos dois notebooks da demonstração, sem compromisso de correspondência visual exata aos equipamentos.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e2e3d"/><stop offset="1" stop-color="#172a45"/></linearGradient><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#e6edf3"/><stop offset=".56" stop-color="#9db3c1"/><stop offset="1" stop-color="#6d8a9a"/></linearGradient><linearGradient id="dell" x2="1" y2="1"><stop stop-color="#163266"/><stop offset="1" stop-color="#41a6c4"/></linearGradient><linearGradient id="hp" x2="1" y2="1"><stop stop-color="#312a5a"/><stop offset="1" stop-color="#8a64d0"/></linearGradient></defs>
<rect width="1200" height="720" rx="34" fill="url(#bg)"/>
<circle cx="1020" cy="96" r="260" fill="#4bd7bc" opacity=".1"/><circle cx="85" cy="550" r="190" fill="#82aaf0" opacity=".08"/>
<text x="60" y="80" font-family="Arial,sans-serif" font-weight="700" font-size="29" letter-spacing="6" fill="#74d4c0">AÇÕES • DEMONSTRAÇÃO</text>
<text x="60" y="146" font-family="Arial,sans-serif" font-weight="700" font-size="55" fill="#ffffff">DOIS NOTEBOOKS</text>
<g transform="translate(40 170)">
<ellipse cx="298" cy="360" rx="257" ry="28" fill="#06151f" opacity=".4"/>
