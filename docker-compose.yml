services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: acoes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in shell or an ignored .env}
      POSTGRES_DB: acoes
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - acoes_db:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/002_reservations.sql:/docker-entrypoint-initdb.d/002-reservations.sql:ro
      - ./database/003_asaas_checkout.sql:/docker-entrypoint-initdb.d/003-asaas-checkout.sql:ro
      - ./database/004_provider_settings.sql:/docker-entrypoint-initdb.d/004-provider-settings.sql:ro
      - ./database/005_asaas_dual_environment.sql:/docker-entrypoint-initdb.d/005-asaas-dual-environment.sql:ro
      - ./database/006_sandbox_pix_demos.sql:/docker-entrypoint-initdb.d/006-sandbox-pix-demos.sql:ro
      - ./database/007_action_catalog.sql:/docker-entrypoint-initdb.d/007-action-catalog.sql:ro
      - ./database/008_action_details.sql:/docker-entrypoint-initdb.d/008-action-details.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acoes -d acoes"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  acoes_db:
