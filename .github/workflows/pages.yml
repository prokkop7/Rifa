name: Publicar demonstração

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Verificar arquivos públicos
        run: |
          test -f docs/index.html
          test -f docs/.nojekyll
          ! grep -R -l -E 'ADMIN_API_KEY|DATABASE_URL|ASAAS_API_KEY' docs
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empacotar somente a pasta pública
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
