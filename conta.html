<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ações • Minha conta</title><style>
:root{font:16px/1.5 system-ui,Segoe UI,sans-serif;background:#08111f;color:#ebf4ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#214366,#08111f 55%);min-height:100vh}.wrap{max-width:790px;margin:0 auto;padding:24px 16px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}a{color:#9bd9ff}.brand{font-weight:800;letter-spacing:.09em;font-size:21px}.card{background:#13243a;border:1px solid #344a62;border-radius:18px;padding:22px;margin-bottom:18px}.card h1{font-size:25px;margin-top:0}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{padding:10px 14px;border-radius:10px;border:1px solid #48617d;background:#1a3553;color:#eff7ff;cursor:pointer}.tabs button[aria-selected=true]{background:#9ed3ff;color:#091626}.hidden{display:none!important}label{display:block;margin:12px 0 6px;font-weight:650;font-size:13px}input{width:100%;padding:12px;border:1px solid #496583;border-radius:10px;background:#0b1b2e;color:#fff;font:inherit}.cta{background:#87caff;color:#081626;border:0;padding:13px 18px;border-radius:10px;margin-top:16px;cursor:pointer;font-weight:800}.cta:disabled{opacity:.5}.status{color:#a8d5fc}.error{color:#ffb6ae}.success{color:#9ae5c0}.entry{border-top:1px solid #38516f;padding:12px 0}.entry small{color:#b6cce5;display:block}p{color:#bed0e5}.notice{font-size:12px;color:#a7b6c8}</style></head><body><div class="wrap"><header><div class="brand">✦ AÇÕES</div><a href="./app.html">Ver campanhas</a></header><section class="card" id="guest"><h1>Acesso do participante</h1><p>Crie uma conta para registrar participações gratuitas em campanhas autorizadas e consultar seu histórico.</p><div class="tabs"><button type="button" id="loginTab" aria-selected="true">Entrar</button><button type="button" id="registerTab" aria-selected="false">Criar conta</button></div><form id="form"><div id="nameGroup" class="hidden"><label for="name">Nome completo</label><input id="name" minlength="3" maxlength="120" autocomplete="name"></div><label for="phone">Telefone com DDD</label><input id="phone" type="tel" required autocomplete="tel" placeholder="(22) 99999-9999"><label for="password">Senha (mínimo 12 caracteres)</label><input id="password" type="password" required minlength="12" maxlength="128" autocomplete="current-password"><button class="cta" id="send">Entrar</button></form><p id="authStatus" aria-live="polite"></p><p class="notice">O telefone ainda não é verificado por SMS. Não reutilize senhas importantes.</p></section><section id="signed" class="card hidden"><h1>Minhas participações</h1><div id="identity"></div><p id="historyStatus" aria-live="polite"></p><div id="entries"></div><button class="cta" id="logout">Sair</button></section></div><script src="./config.js"></script><script>
"use strict";const API=(window.ACOES_API_URL||"").replace(/\/$/,""),$=x=>document.querySelector(x);let mode="login";let token=sessionStorage.getItem("acoes_token")||"";
function setStatus(id,message,ok=false){$(id).textContent=message;$(id).className=ok?"success":"error"}
async function api(path,method="GET",data){const response=await fetch(API+path,{method,headers:{"Accept":"application/json",...(data?{"Content-Type":"application/json"}:{}),...(token?{"Authorization":"Bearer "+token}:{})},...(data?{body:JSON.stringify(data)}:{})});const r=await response.json().catch(()=>({}));if(!response.ok)throw Error(r.error||"Erro HTTP "+response.status);return r}
function setMode(next){mode=next;$("#nameGroup").classList.toggle("hidden",next!=="register");$("#name").required=next==="register";$("#password").autocomplete=next==="register"?"new-password":"current-password";$("#send").textContent=next==="register"?"Criar conta":"Entrar";$("#loginTab").setAttribute("aria-selected",String(next==="login"));$("#registerTab").setAttribute("aria-selected",String(next==="register"));$("#authStatus").textContent=""}
$("#loginTab").onclick=()=>setMode("login");$("#registerTab").onclick=()=>setMode("register");
$("#form").addEventListener("submit",async e=>{e.preventDefault();const send=$("#send");send.disabled=true;try{const phone=$("#phone").value,password=$("#password").value;if(mode==="register"){await api("/api/auth/register","POST",{fullName:$("#name").value,phone,password});setMode("login");setStatus("#authStatus","Conta criada. Faça login.",true)}else{const result=await api("/api/auth/login","POST",{phone,password});token=result.accessToken;sessionStorage.setItem("acoes_token",token);await loadMe()}}catch(err){setStatus("#authStatus",err.message)}finally{send.disabled=false}});
async function loadMe(){if(!token)return;try{const [me,history]=await Promise.all([api("/api/me"),api("/api/me/entries")]);$("#guest").classList.add("hidden");$("#signed").classList.remove("hidden");$("#identity").textContent=me.fullName+" • "+me.phone;const root=$("#entries");root.replaceChildren();if(!history.entries.length){$("#historyStatus").textContent="Nenhuma participação registrada.";return}$("#historyStatus").textContent=history.entries.length+" registro(s) encontrado(s).";for(const e of history.entries){const art=document.createElement("article");art.className="entry";const title=document.createElement("strong");title.textContent=e.title+" • Nº "+String(e.number).padStart(3,"0");const detail=document.createElement("small");detail.textContent="ID: "+e.entry_id+" • "+new Date(e.created_at).toLocaleString("pt-BR")+" • "+e.status;art.append(title,detail);root.append(art)}}catch(err){token="";sessionStorage.removeItem("acoes_token");$("#guest").classList.remove("hidden");$("#signed").classList.add("hidden");setStatus("#authStatus","Sessão inválida ou expirada. Entre novamente.")}}
$("#logout").onclick=async()=>{try{await api("/api/auth/logout","POST")}catch{}token="";sessionStorage.removeItem("acoes_token");$("#signed").classList.add("hidden");$("#guest").classList.remove("hidden");$("#password").value="";setStatus("#authStatus","Sessão encerrada.",true)};
loadMe();
</script></body></html>
